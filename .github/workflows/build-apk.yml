name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Cache sherpa-onnx AAR, ASR model and CAMP++ voiceprint model
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/model
          key: sherpa-onnx-zh-14m-campplus-v2

      - name: Cache persistent APK signing keystore
        uses: actions/cache@v4
        with:
          path: signing/release.jks
          key: catchphrase-guard-signing-keystore-v1

      - name: Ensure signing keystore exists
        run: |
          mkdir -p signing
          if [ ! -f signing/release.jks ]; then
            keytool -genkeypair -v \
              -keystore signing/release.jks \
              -storetype PKCS12 \
              -alias catchphrase \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass catchphrase123 -keypass catchphrase123 \
              -dname "CN=CatchphraseGuard, OU=Personal, O=SelfUse, L=CN, ST=CN, C=CN"
          fi

      - name: Download sherpa-onnx AAR & offline Chinese ASR + Voiceprint models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prepare_dependencies.sh

      - name: Build signed Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "CatchphraseGuard-v4.0.${GITHUB_RUN_NUMBER}.apk"
          ls -lh "CatchphraseGuard-v4.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CatchphraseGuard-APK
          path: CatchphraseGuard-v4.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (1-click mobile download)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: "口头禅猎手 v4.0.${{ github.run_number }}（全页面网易云暗夜黑胶 + 鲸云调音台重构版）"
          body: |
            ### v4.0 全页面网易云音乐风交互重构
            - **① 黑胶唱针监听台**：拟真黑胶唱片微纹路反光旋转 + 机械银色唱臂起落 + 鲸云音效律动外环 + 三行滚动歌词珊瑚红高亮 + 抓包热评抽屉。
            - **② 声纹歌单热榜**：黑胶 VIP 黑金声纹卡 + 零念稿录音棚暗色弹窗 + 按触发频次实时排行的「热词盯防榜（01/02/03）」。
            - **③ 鲸云声学调音台与设置中心**：年度听歌报告风黑金红双战报卡 + 2×2 发光音效插件矩阵（彻底告别原生粗糙开关）+ 流光灵敏度推子 + 凹槽冷却分段器。
            - **全局悬浮迷你黑胶条**：在声纹榜与调音台页面常驻底部迷你黑胶播放条，随时看实时听写、一键启停。
          files: CatchphraseGuard-v4.0.${{ github.run_number }}.apk
          make_latest: true
