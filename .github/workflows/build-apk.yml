name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Cache sherpa-onnx AAR and Chinese ASR model
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/model
          key: sherpa-onnx-zh-14m-deps-v1

      - name: Cache persistent APK signing keystore
        uses: actions/cache@v4
        with:
          path: signing/release.jks
          key: catchphrase-guard-signing-keystore-v1

      - name: Ensure signing keystore exists
        run: |
          mkdir -p signing
          if [ ! -f signing/release.jks ]; then
            keytool -genkeypair -v \
              -keystore signing/release.jks \
              -storetype PKCS12 \
              -alias catchphrase \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass catchphrase123 -keypass catchphrase123 \
              -dname "CN=CatchphraseGuard, OU=Personal, O=SelfUse, L=CN, ST=CN, C=CN"
          fi

      - name: Download sherpa-onnx AAR & offline Chinese model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prepare_dependencies.sh

      - name: Build signed Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "CatchphraseGuard-v1.0.${GITHUB_RUN_NUMBER}.apk"
          ls -lh "CatchphraseGuard-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CatchphraseGuard-APK
          path: CatchphraseGuard-v1.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (1-click mobile download)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "口头禅猎手 v1.0.${{ github.run_number }}"
          body: |
            ### 手机端一键下载安装说明（vivo X500 Pro / Android 17）
            1. 直接点击下方 Assets 中的 **`CatchphraseGuard-v1.0.${{ github.run_number }}.apk`** 下载并安装。
            2. 打开 App，默认已预置盯防口头禅：**「没有」**、**「不是」**（可在界面内随时增删其他词）。
            3. 先点一次 **「发送一条测试推送消息」**，并在 **「通知设置」** 中打开【悬浮通知】和【锁屏通知】。
            4. 点击 **「申请后台免杀」**，并在 vivo【设置 → 电池 → 后台耗电管理】中将本应用设为【允许后台高耗电】。
          files: CatchphraseGuard-v1.0.${{ github.run_number }}.apk
          make_latest: true
