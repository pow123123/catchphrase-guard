name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Cache sherpa-onnx AAR, ASR model and CAMP++ voiceprint model
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/model
          key: sherpa-onnx-zh-14m-campplus-v2

      - name: Cache persistent APK signing keystore
        uses: actions/cache@v4
        with:
          path: signing/release.jks
          key: catchphrase-guard-signing-keystore-v1

      - name: Ensure signing keystore exists
        run: |
          mkdir -p signing
          if [ ! -f signing/release.jks ]; then
            keytool -genkeypair -v \
              -keystore signing/release.jks \
              -storetype PKCS12 \
              -alias catchphrase \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass catchphrase123 -keypass catchphrase123 \
              -dname "CN=CatchphraseGuard, OU=Personal, O=SelfUse, L=CN, ST=CN, C=CN"
          fi

      - name: Download sherpa-onnx AAR & offline Chinese ASR + Voiceprint models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prepare_dependencies.sh

      - name: Build signed Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "CatchphraseGuard-v3.1.${GITHUB_RUN_NUMBER}.apk"
          ls -lh "CatchphraseGuard-v3.1.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CatchphraseGuard-APK
          path: CatchphraseGuard-v3.1.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (1-click mobile download)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.${{ github.run_number }}
          name: "口头禅猎手 v3.1.${{ github.run_number }}（通知推送图标同步升级）"
          body: |
            ### v3.1 推送消息与状态栏图标同步换新
            - **推送横幅彩色大图标 (`setLargeIcon`)**：消息推送与常驻通知均嵌入圆角精修版「暖调金属陶瓷声波图标」。
            - **状态栏五道声波小图标 (`ic_wave_notify`) + 珊瑚橙品牌色**：替换掉旧版麦克风小图标，全链路视觉统一。
            - *小贴士：如果 vivo OriginOS 顶部横幅最左上角极小的系统应用角标因覆盖安装仍缓存旧图标，重启一次手机或卸载旧版重装即可彻底刷新系统图标缓存。*
          files: CatchphraseGuard-v3.1.${{ github.run_number }}.apk
          make_latest: true
