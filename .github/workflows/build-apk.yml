name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Cache sherpa-onnx AAR, ASR model and CAMP++ voiceprint model
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/model
          key: sherpa-onnx-zh-14m-campplus-v2

      - name: Cache persistent APK signing keystore
        uses: actions/cache@v4
        with:
          path: signing/release.jks
          key: catchphrase-guard-signing-keystore-v1

      - name: Ensure signing keystore exists
        run: |
          mkdir -p signing
          if [ ! -f signing/release.jks ]; then
            keytool -genkeypair -v \
              -keystore signing/release.jks \
              -storetype PKCS12 \
              -alias catchphrase \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass catchphrase123 -keypass catchphrase123 \
              -dname "CN=CatchphraseGuard, OU=Personal, O=SelfUse, L=CN, ST=CN, C=CN"
          fi

      - name: Download sherpa-onnx AAR & offline Chinese ASR + Voiceprint models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prepare_dependencies.sh

      - name: Build signed Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "CatchphraseGuard-v2.0.${GITHUB_RUN_NUMBER}.apk"
          ls -lh "CatchphraseGuard-v2.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CatchphraseGuard-APK
          path: CatchphraseGuard-v2.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (1-click mobile download)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "口头禅猎手 v2.0.${{ github.run_number }}（OriginOS 焕新版 + 本人声纹过滤）"
          body: |
            ### v2.0 更新亮点
            - **本人声纹专属过滤**：内置 3D-Speaker CAMP++ 本地中文声纹模型，三步录入个人声纹后，只有你自己的声音才会触发推送提醒，他人说话自动静默拦截并标记相似度。
            - **OriginOS 原生质感交互升级**：全新底部三栏分页（监听主控台 / 声纹与词库 / 统计与设置）、动态声波呼吸环、实时声纹试音沙盒，支持深浅色自动切换。
            - **支持直接覆盖升级**：点击下方 `CatchphraseGuard-v2.0.${{ github.run_number }}.apk` 直接安装即可无缝覆盖旧版本。
          files: CatchphraseGuard-v2.0.${{ github.run_number }}.apk
          make_latest: true
