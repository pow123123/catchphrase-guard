name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Cache sherpa-onnx AAR, ASR model and CAMP++ voiceprint model
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/model
          key: sherpa-onnx-zh-14m-campplus-v2

      - name: Cache persistent APK signing keystore
        uses: actions/cache@v4
        with:
          path: signing/release.jks
          key: catchphrase-guard-signing-keystore-v1

      - name: Ensure signing keystore exists
        run: |
          mkdir -p signing
          if [ ! -f signing/release.jks ]; then
            keytool -genkeypair -v \
              -keystore signing/release.jks \
              -storetype PKCS12 \
              -alias catchphrase \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass catchphrase123 -keypass catchphrase123 \
              -dname "CN=CatchphraseGuard, OU=Personal, O=SelfUse, L=CN, ST=CN, C=CN"
          fi

      - name: Download sherpa-onnx AAR & offline Chinese ASR + Voiceprint models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prepare_dependencies.sh

      - name: Build signed Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "CatchphraseGuard-v3.0.${GITHUB_RUN_NUMBER}.apk"
          ls -lh "CatchphraseGuard-v3.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CatchphraseGuard-APK
          path: CatchphraseGuard-v3.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (1-click mobile download)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "口头禅猎手 v3.0.${{ github.run_number }}（流光液态玻璃美学 + 零念稿闲聊声纹版）"
          body: |
            ### v3.0 全面视觉重塑与自然交互升级
            - **Aura Liquid Glass 流光液态玻璃界面**：弥散极光动态画布、3D 彩虹折射液态水晶球、对称细线声波频谱卡、底部悬浮毛玻璃胶囊 Dock。
            - **定制高辨识度桌面图标**：拉丝银底盘 + 哑光米白陶瓷珊瑚橙声波键高清图标直装桌面。
            - **零念稿「快问快答」声纹工坊**：彻底取消 3.5 秒固定读秒和书面台词，改为气泡日常提问与反驳梗（支持换题），像聊微信一样按住随口答松手即停，或轻点免提说完停顿 0.7 秒自动收尾！
          files: CatchphraseGuard-v3.0.${{ github.run_number }}.apk
          make_latest: true
