name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Cache sherpa-onnx AAR, ASR model and CAMP++ voiceprint model
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/model
          key: sherpa-onnx-zh-14m-campplus-v2

      - name: Cache persistent APK signing keystore
        uses: actions/cache@v4
        with:
          path: signing/release.jks
          key: catchphrase-guard-signing-keystore-v1

      - name: Ensure signing keystore exists
        run: |
          mkdir -p signing
          if [ ! -f signing/release.jks ]; then
            keytool -genkeypair -v \
              -keystore signing/release.jks \
              -storetype PKCS12 \
              -alias catchphrase \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass catchphrase123 -keypass catchphrase123 \
              -dname "CN=CatchphraseGuard, OU=Personal, O=SelfUse, L=CN, ST=CN, C=CN"
          fi

      - name: Download sherpa-onnx AAR & offline Chinese ASR + Voiceprint models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prepare_dependencies.sh

      - name: Build signed Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "CatchphraseGuard-v5.0.${GITHUB_RUN_NUMBER}.apk"
          ls -lh "CatchphraseGuard-v5.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CatchphraseGuard-APK
          path: CatchphraseGuard-v5.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (1-click mobile download)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.${{ github.run_number }}
          name: "口头禅猎手 v5.0.${{ github.run_number }}（习惯教练交互重构版）"
          body: |
            ### v5.0 习惯教练交互与架构全面重构
            - **把高频动作移出 App**：新增下拉控制中心快捷开关（Quick Settings Tile）、常驻通知栏计时与 `[暂停 15 分钟]/[继续]`/`[结束]` 按钮、单次提醒通知直接点 `[不是我]` 或 `[暂停 15 分钟]`。
            - **「不是我」一键撤销 + 负样本声纹学习**：在通知或结束小结里点「不是我」，会撤销对应计数，并记住这次他人的声音特征（最多 20 条），下次类似声音自动过滤。
            - **按次监听 + 结束小结 + 趋势追踪**：支持选择「直到我结束 / 30 分钟 / 1 小时 / 2 小时」时长；每次结束后自动生成小结（次数、每小时频率、与上次对比、逐条回顾）；新增「趋势」页（7/30 天柱状图 + 目标虚线 + 连续达标天数 + 各词同比）。
            - **干净克制的原生 Material 3 界面**：双底栏（「今天」/「趋势」）+ 右上角设置；跟随系统深浅色与动态取色，移除装饰性动画；实时转写移至「设置 → 识别 → 检查识别效果」。
            - **保留全部离线核心能力**：Sherpa-ONNX 离线中文 ASR + 3D-Speaker CAMP++ 声纹识别，首次安装提供 4 步引导，老版本覆盖安装自动平滑迁移历史词库与声纹。
          files: CatchphraseGuard-v5.0.${{ github.run_number }}.apk
          make_latest: true
