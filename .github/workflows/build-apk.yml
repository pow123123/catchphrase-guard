name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Cache sherpa-onnx AAR, ASR model and CAMP++ voiceprint model
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/model
          key: sherpa-onnx-zh-14m-campplus-v2

      - name: Cache persistent APK signing keystore
        uses: actions/cache@v4
        with:
          path: signing/release.jks
          key: catchphrase-guard-signing-keystore-v1

      - name: Ensure signing keystore exists
        run: |
          mkdir -p signing
          if [ ! -f signing/release.jks ]; then
            keytool -genkeypair -v \
              -keystore signing/release.jks \
              -storetype PKCS12 \
              -alias catchphrase \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass catchphrase123 -keypass catchphrase123 \
              -dname "CN=CatchphraseGuard, OU=Personal, O=SelfUse, L=CN, ST=CN, C=CN"
          fi

      - name: Download sherpa-onnx AAR & offline Chinese ASR + Voiceprint models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prepare_dependencies.sh

      - name: Build signed Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "CatchphraseGuard-v2.1.${GITHUB_RUN_NUMBER}.apk"
          ls -lh "CatchphraseGuard-v2.1.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CatchphraseGuard-APK
          path: CatchphraseGuard-v2.1.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (1-click mobile download)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: "口头禅猎手 v2.1.${{ github.run_number }}（声纹高精准度调优版）"
          body: |
            ### v2.1 声纹精准度深度调优
            - **消除帧拼接断裂**：改为保留连续不断裂的自然发音波形（仅裁剪首尾空白），完整保留「不是 / 没有」中的清辅音与连读声学特征。
            - **切换纯净线性音源 (`VOICE_RECOGNITION`) + 自动响度归一化**：绕过手机底层非线性降噪失真，远近说话能量统一。
            - **多尺度短窗声纹库 + 对话停顿隔离**：录入时同步提取 1.1s 短语子特征匹配短促口头禅统计分布，并在 400ms 停顿处隔离对话轮次，避免与对方前一句话混音。
            - **动态流一键校准学习**：如果某次低声嘟囔被误拦，点击动态里的「其实是我说的 · 点此一键校准学习」即可将该语气加入声纹库，越用越准！
            - **注意**：升级安装后，请先去「声纹与词库」点一次 **「重新校准我的声纹」** 以用全新的纯净音源生成多尺度声纹库。
          files: CatchphraseGuard-v2.1.${{ github.run_number }}.apk
          make_latest: true
